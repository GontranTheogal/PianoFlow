# Construit l'app iOS sur un Mac virtuel gratuit fourni par GitHub, sans que tu aies besoin
# d'en posséder un. Produit un .app pour le simulateur (pas signé, pas installable sur un vrai
# iPad). Pour un vrai iPad, il faut la signature Apple : voir STEP_BY_STEP.md, étape iPad #5.
name: build-ios
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - run: '[ -d ios ] || npx cap add ios'
      - run: npx cap sync ios
      - run: bash ios-additions/setup-ios.sh
      - name: Build (simulateur, non signé)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
