# App iPad « coquille » pour SideStore / AltStore (sans compte Apple Developer payant) : voir SIDESTORE.md.
# L'app affiche le site Netlify (server.url) et ajoute le MIDI natif (CoreMIDI) : chaque mise à jour du site arrive
# dans l'app au prochain lancement. Ce .ipa n'est PAS signé : SideStore le signe avec ton identifiant Apple gratuit.
# Lancement : onglet Actions → ios-sideload → Run workflow (adresse de l'appli : GitHub Pages par défaut).
name: ios-sideload
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Adresse https de l'appli (vide : la page GitHub Pages du dépôt)"
        required: false
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adresse du site
        # par défaut : l'appli publiée sur GitHub Pages (la synchro, elle, reste sur Netlify : voir GITHUB_PAGES.md)
        env: { SITE_URL: "${{ inputs.site_url || vars.PIANOFLOW_APP_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" }
        run: |
          case "$SITE_URL" in https://*) ;; *) echo "::error::Donne l'adresse https du site (champ site_url ou variable PIANOFLOW_URL)"; exit 1;; esac
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.server = { url: process.env.SITE_URL.replace(/\/+$/, "") };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            console.log(JSON.stringify(c, null, 2));'
      - run: npm ci
      - run: npm run build
      - run: '[ -d ios ] || npx cap add ios'
      - run: npx cap sync ios
      - run: bash ios-additions/setup-ios.sh
      - name: Build iPad (non signé)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Paquet .ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qr PianoFlow.ipa Payload && ls -lh PianoFlow.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-ipa
          path: out/PianoFlow.ipa
